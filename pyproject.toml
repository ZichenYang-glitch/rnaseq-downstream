[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-downstream"
version = "0.1.0.dev0"
description = "A research-preview toolkit for evidence-traceable bulk RNA-seq downstream analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
rnaseq-downstream = "rnaseq_downstream.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rnaseq_downstream*"]

[tool.setuptools.package-data]
rnaseq_downstream = ["py.typed"]
