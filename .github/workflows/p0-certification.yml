name: P0 certification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      blas_diagnostic:
        description: Sample BLAS kernels on three runners without running certification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: p0-certification-${{ github.ref }}-${{ inputs.blas_diagnostic && github.run_id || 'certification' }}
  cancel-in-progress: true

jobs:
  locked-oracle-and-simulation:
    name: Locked evidence gates and calibration diagnostics
    if: ${{ !inputs.blas_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENBLAS_CORETYPE: SkylakeX
      P0_PREFIX: ${{ github.workspace }}/.ci/rnaseq-downstream-p0
      RNASEQ_P0_R_LIBRARY: ${{ github.workspace }}/.ci/rnaseq-downstream-p0-r-library
      RNASEQ_P0_BENCHMARK_REPORT_DIR: ${{ github.workspace }}/benchmark-results

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Record runner CPU identity
        run: python3 scripts/ci/report_blas_runtime.py

      - name: Require SkylakeX ISA before environment installation
        run: python3 scripts/ci/preflight_blas.py

      - name: Install the Conda bootstrap tool
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: true
          miniforge-version: latest
          conda-remove-defaults: 'true'

      - name: Install the reviewed conda-lock frontend
        shell: bash -el {0}
        run: python -m pip install --disable-pip-version-check conda-lock==4.0.1

      - name: Restore the exact locked Conda prefix
        shell: bash -el {0}
        run: conda-lock install --prefix "$P0_PREFIX" conda-lock.yml

      - name: Install the toolkit without resolving new dependencies
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Record the locked BLAS runtime
        shell: bash -el {0}
        env:
          OPENBLAS_VERBOSE: "2"
        run: >-
          conda run --prefix "$P0_PREFIX" --no-capture-output
          python scripts/ci/report_blas_runtime.py --prefix "$P0_PREFIX" --expect-core SkylakeX

      - name: Restore the exact R and Bioconductor library from source locks
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX"
          Rscript --vanilla environment/bootstrap.R
          --library "$RNASEQ_P0_R_LIBRARY"

      - name: Verify the locked runtime identity
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX"
          Rscript --vanilla environment/verify.R
          --library "$RNASEQ_P0_R_LIBRARY"

      - name: Run non-skippable certification and calibration tests
        shell: bash -el {0}
        env:
          RNASEQ_P0_REQUIRE_BENCHMARKS: "1"
          RNASEQ_P0_RSCRIPT: ${{ github.workspace }}/.ci/rnaseq-downstream-p0/bin/Rscript
        # The DESeq2 modules below check archived exploratory disclosures,
        # diagnostic hashes, and fail-closed mechanics; they cannot execute the
        # sealed held-out seed grid.
        run: >-
          conda run --prefix "$P0_PREFIX" --no-capture-output
          python -m pytest
          tests/unit tests/integration
          tests/oracle/test_benchmark_report_schema.py
          tests/oracle/test_airway_oracle.py
          tests/oracle/test_deseq2_airway_oracle.py
          tests/oracle/test_pathway_airway_oracle.py
          tests/simulation/test_compcoder_gate.py
          tests/simulation/test_deseq2_compcoder_gate.py
          tests/simulation/test_deseq2_compcoder_mechanism_diagnostic.py
          tests/simulation/test_pathway_compcoder_gate.py
          -v

      - name: Build environment compatibility evidence
        shell: bash -el {0}
        run: |
          conda run --prefix "$P0_PREFIX" --no-capture-output \
            python scripts/benchmark/build_environment_compatibility_report.py \
            --reports "$RNASEQ_P0_BENCHMARK_REPORT_DIR" \
            --output "$RNASEQ_P0_BENCHMARK_REPORT_DIR/p1-environment-compatibility-report.json"

      - name: Verify frozen DESeq2 oracle numeric artifacts
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX" --no-capture-output
          python scripts/ci/check_benchmark_artifacts.py
          --baseline tests/oracle/deseq2-airway-benchmark-report.json
          --current "$RNASEQ_P0_BENCHMARK_REPORT_DIR/deseq2-airway-benchmark-report.json"

      - name: Archive machine-readable benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Includes passing live gates and the environment-compatibility report.
          name: p0-benchmark-reports
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 90

  blas-kernel-diagnostic:
    name: BLAS kernel diagnostic (sample ${{ matrix.sample }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.blas_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    env:
      P0_PREFIX: ${{ github.workspace }}/.ci/rnaseq-downstream-p0
      RNASEQ_P0_R_LIBRARY: ${{ github.workspace }}/.ci/rnaseq-downstream-p0-r-library
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Record runner CPU identity
        run: python3 scripts/ci/report_blas_runtime.py

      - name: Install the Conda bootstrap tool
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: true
          miniforge-version: latest
          conda-remove-defaults: 'true'

      - name: Install the reviewed conda-lock frontend
        shell: bash -el {0}
        run: python -m pip install --disable-pip-version-check conda-lock==4.0.1

      - name: Restore the exact locked Conda prefix
        shell: bash -el {0}
        run: conda-lock install --prefix "$P0_PREFIX" conda-lock.yml

      - name: Install the toolkit without resolving new dependencies
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Record the automatic locked BLAS runtime
        shell: bash -el {0}
        env:
          OPENBLAS_VERBOSE: "2"
        run: >-
          conda run --prefix "$P0_PREFIX" --no-capture-output
          python scripts/ci/report_blas_runtime.py --prefix "$P0_PREFIX"

      - name: Restore the exact R and Bioconductor library from source locks
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX"
          Rscript --vanilla environment/bootstrap.R
          --library "$RNASEQ_P0_R_LIBRARY"

      - name: Verify the locked runtime identity
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX"
          Rscript --vanilla environment/verify.R
          --library "$RNASEQ_P0_R_LIBRARY"

      - name: Sample ISA-compatible kernels against frozen airway bytes
        shell: bash -el {0}
        run: >-
          conda run --prefix "$P0_PREFIX" --no-capture-output
          python scripts/ci/run_blas_diagnostic.py --prefix "$P0_PREFIX"
          --output "${{ github.workspace }}/blas-diagnostic-results"

      - name: Archive diagnostic benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blas-diagnostic-sample-${{ matrix.sample }}
          path: blas-diagnostic-results/**/*.json
          if-no-files-found: warn
          retention-days: 90
